<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ZonaFit Gym</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>
<h:body>
    <div class="card">
        <h:form id="forma-clientes">
            <p:growl id="mensajes" showDetails="true"/>
            <!--MenuBar -->
            <div class="card">
                <p:menubar>
                    <p:menuitem value="inicio" icon="pi pi-fw-user" update=":forma-clientes:clientes-tabla"
                    actionListener="#{indexControlador.cargarDatos}"/>
                <p:menuitem value="Nuevo Cliente" icon="pi pi-fw pi-plus" actionListener="#{indexControlador.agregarCliente}"
                            update=":forma-modal:cliente-ventana" oncomplete="PF('ventanaModalCliente').show()">
                </p:menuitem>
                </p:menubar>
            </div>
            <!--Tabla -->
            <div class="card">
                <p:dataTable value="#{indexControlador.clientes}" var="cliente"
                             id="clientes-tabla" widgetVar="clientesTabla">
                    <f:facet name="header">
                        <div class=" flex justify-content-center flex-wrap card-container">
                            <div class ="flex align-items-center justify-content-center w-20rem h-4rem font-bold text-gray-900 border-round m-2">
                                <h3>Bienvenido a ZonaFit Gym</h3>
                            </div>
                        </div>
                    </f:facet>

                    <p:column headerText="Id">
                        <h:outputText value="#{cliente.id}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{cliente.nombre}"/>
                    </p:column>

                    <p:column headerText="Apellido">
                        <h:outputText value="#{cliente.apellido}"/>
                    </p:column>

                    <p:column headerText="Membresia">
                        <h:outputText value="#{cliente.membresia}"/>
                    </p:column>

                    <p:column>
                        <p:commandButton value="Editar" icon="pi pi-pencil" update="forma-modal:cliente-ventana"
                                         process="@this" oncomplete="PF('ventanaModalCliente').show()" class="ui-botton-primary"
                                        style="margin-right: .5rem">
                            <f:setPropertyActionListener value="#{cliente}" target="#{indexControlador.clienteSeleccionado}"/>
                            <p:resetInput target=":forma-modal:cliente-ventana"/>
                        </p:commandButton>

                        <p:commandButton value="Eliminar" class="ui-button-danger" icon="pi pi-trash" process="@this"
                                         oncomplete="PF('eliminarClienteVentana').show()">
                            <f:setPropertyActionListener value="#{cliente}" target="#{indexControlador.clienteSeleccionado}"/>
                        </p:commandButton>
                        </p:column>

                </p:dataTable>
            </div>
        </h:form>
        <h:form id="forma-modal">
            <p:dialog header="Detalles Cliente" showEffect="fade" modal="true" widgetVar="ventanaModalCliente"
                      responsive="true">
                <p:outputPanel id="cliente-ventana" class ="ui-fluid">
                    <div class="field">
                        <p:outputLabel for="nombre">Nombre</p:outputLabel>
                        <p:inputText id="nombre" value="#{indexControlador.clienteSeleccionado.nombre}" required="true"/>
                    </div>
                    <div class="field">
                        <p:outputLabel for="apellido">Apellido</p:outputLabel>
                        <p:inputText id="apellido" value="#{indexControlador.clienteSeleccionado.apellido}"/>

                    </div>
                    <div class="field">
                        <p:outputLabel for="membresia">Membresia</p:outputLabel>
                        <p:inputNumber  id="membresia" value="#{indexControlador.clienteSeleccionado.membresia}" required="true"/>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" process="cliente-ventana @this" actionListener="#{indexControlador.guardarCliente}"/>
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('ventanaModalCliente').hide()"/>
                </f:facet>
            </p:dialog>
            <p:confirmDialog widgetVar="eliminarClienteVentana" showEffect="fade" width="300" message="Esta seguro que desea eliminar este cliente?"
                            header="Confirmar" severity="warn">
            <p:commandButton value="Si" icon="pi pi-check" actionListener="#{indexControlador.eliminarCliente}" process="@this"
                             oncomplete="PF('eliminarClienteVentana').hide()"/>
            <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times" onclick="PF('eliminarClienteVentana').hide()"/>
            </p:confirmDialog>
        </h:form>
    </div>
</h:body>
</html>
